<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Libreta · __NEGOCIO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* La libreta: una pantalla de chat y nada más. Sin menús, sin secciones: se abre, se pregunta y se cierra. */
:root{
  --fondo:#f7f5f0; --texto:#1d1a15; --suave:#6b6459; --linea:rgba(29,26,21,.12);
  --burbuja:#ffffff; --mia:#1d1a15; --mia-texto:#f7f5f0; --campo:#fff;
}
@media(prefers-color-scheme:dark){
  :root{--fondo:#12100d; --texto:#ece7dd; --suave:#9a9287; --linea:rgba(236,231,221,.14);
    --burbuja:rgba(255,255,255,.06); --mia:#ece7dd; --mia-texto:#12100d; --campo:rgba(255,255,255,.06)}
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--fondo);color:var(--texto);
  font:16px/1.6 Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:14px 18px;border-bottom:1px solid var(--linea);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header b{font-size:15px;letter-spacing:-.01em}
header span{font-size:12.5px;color:var(--suave)}
header button{margin-left:auto;font:inherit;font-size:12.5px;color:var(--suave);background:none;border:0;cursor:pointer;padding:4px 8px;border-radius:8px}
header button:hover{background:var(--linea)}

#hilo{flex:1;overflow-y:auto;padding:22px 18px 8px}
.centro{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.vacio{margin:14vh auto 0;max-width:560px;text-align:center;color:var(--suave)}
.vacio h1{font-size:23px;color:var(--texto);margin:0 0 8px;letter-spacing:-.02em}
.vacio p{margin:0 0 18px;font-size:14.5px}
.ideas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ideas button{font:inherit;font-size:13.5px;color:var(--texto);background:var(--burbuja);border:1px solid var(--linea);
  border-radius:999px;padding:7px 14px;cursor:pointer}
.ideas button:hover{border-color:var(--suave)}

.turno{display:flex;flex-direction:column;gap:6px}
.turno .quien{font-size:12px;color:var(--suave);font-weight:600}
.mia{align-self:flex-end;max-width:85%;background:var(--mia);color:var(--mia-texto);padding:10px 14px;border-radius:16px 16px 4px 16px}
.suya{white-space:pre-wrap;padding:2px 0}
.suya.pensando{color:var(--suave)}
.punto{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:currentColor;opacity:.35;animation:late 1.2s infinite}
.punto:nth-child(2){animation-delay:.15s}.punto:nth-child(3){animation-delay:.3s}
@keyframes late{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.punto{animation:none}}
.copiar{align-self:flex-start;font:inherit;font-size:12px;color:var(--suave);background:none;border:1px solid var(--linea);
  border-radius:8px;padding:3px 9px;cursor:pointer}
.copiar:hover{color:var(--texto)}
.mal{color:#b4342b}

footer{padding:10px 18px 16px;border-top:1px solid var(--linea)}
.caja{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--campo);
  border:1px solid var(--linea);border-radius:18px;padding:8px 8px 8px 14px}
textarea{flex:1;border:0;background:none;color:inherit;font:inherit;resize:none;outline:none;max-height:180px;min-height:26px;padding:6px 0}
.enviar{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:50%;background:var(--mia);color:var(--mia-texto);
  cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center}
.enviar:disabled{opacity:.35;cursor:default}
.clip{width:32px;height:32px;flex:0 0 32px;border:1px solid var(--linea);border-radius:50%;background:none;
  color:var(--suave);font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;margin-bottom:2px}
.clip:hover{color:var(--texto);border-color:var(--suave)}
.adjuntos{max-width:720px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.adjuntos span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--suave);
  background:var(--burbuja);border:1px solid var(--linea);border-radius:999px;padding:4px 6px 4px 11px}
.adjuntos button{border:0;background:none;color:inherit;cursor:pointer;font:inherit;font-size:14px;line-height:1;padding:0 4px}
.adjuntos button:hover{color:var(--texto)}
.pie{max-width:720px;margin:8px auto 0;font-size:11.5px;color:var(--suave);text-align:center}
</style>
</head>
<body>
<header>
  <b>Libreta</b><span>__NEGOCIO__</span>
  <button id="limpiar" hidden>Empezar de nuevo</button>
</header>

<div id="hilo">
  <div class="centro" id="centro">
    <div class="vacio" id="vacio">
      <h1>¿Qué necesitas?</h1>
      <p>Pregunta lo que sea. Sabe de __NEGOCIO__, así que lo que escriba sale con su tono.</p>
      <div class="ideas">
        <button>Escríbeme un recordatorio de cita, corto y amable</button>
        <button>¿Cómo le respondo a alguien que pide descuento?</button>
        <button>Dame tres ideas para recuperar clientes que no volvieron</button>
      </div>
    </div>
    <div id="turnos"></div>
  </div>
</div>

<footer>
  <div class="caja">
    <button class="clip" id="clip" title="Adjuntar un documento">+</button>
    <textarea id="campo" rows="1" placeholder="Escribe aquí… (Enter envía, Shift+Enter salto de línea)" autofocus></textarea>
    <button class="enviar" id="enviar" title="Enviar" disabled>↑</button>
    <input type="file" id="archivos" multiple hidden
           accept=".txt,.md,.csv,.json,.docx,.xlsx,text/plain,text/csv,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  </div>
  <div class="adjuntos" id="adjuntos"></div>
  <div class="pie">Puedes adjuntar Word, Excel o texto (máximo 2 MB). Nada de esto se guarda: si recargas, se pierde.</div>
</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var hilo = [];               // lo dicho, solo en memoria: recargar es empezar de cero
  var pegados = [];            // los archivos de la pregunta que se está escribiendo
  var esperando = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function abajo() { $('hilo').scrollTop = $('hilo').scrollHeight; }

  // 🪤 Los turnos se pintan en su propio contenedor. Pintarlos sobre `#centro` se llevaba por delante la
  // pantalla de bienvenida con sus botones de ideas, y había que rehacerla a mano cada vez.
  function pintar() {
    $('vacio').hidden = hilo.length > 0;
    $('limpiar').hidden = hilo.length === 0;
    $('turnos').innerHTML = hilo.map(function (t, i) {
      var suya = t.respuesta === null
        ? '<div class="suya pensando"><span class="punto"></span><span class="punto"></span><span class="punto"></span></div>'
        : '<div class="suya' + (t.error ? ' mal' : '') + '">' + esc(t.respuesta) + '</div>'
          + (t.error ? '' : '<button class="copiar" data-copiar="' + i + '">Copiar</button>');
      return '<div class="turno"><div class="mia">' + esc(t.pregunta) + '</div></div>'
           + '<div class="turno">' + suya + '</div>';
    }).join('');
    $('turnos').querySelectorAll('[data-copiar]').forEach(function (b) {
      b.onclick = function () {
        navigator.clipboard.writeText(hilo[Number(b.getAttribute('data-copiar'))].respuesta || '');
        b.textContent = 'Copiado';
        setTimeout(function () { b.textContent = 'Copiar'; }, 1500);
      };
    });
    abajo();
  }

  function pintarAdjuntos() {
    $('adjuntos').innerHTML = pegados.map(function (f, i) {
      return '<span>' + esc(f.name) + '<button data-quitar="' + i + '" title="Quitar">×</button></span>';
    }).join('');
    $('adjuntos').querySelectorAll('[data-quitar]').forEach(function (b) {
      b.onclick = function () { pegados.splice(Number(b.getAttribute('data-quitar')), 1); pintarAdjuntos(); };
    });
    $('enviar').disabled = esperando || (!$('campo').value.trim() && !pegados.length);
  }

  function preguntar(texto) {
    if (esperando || (!texto.trim() && !pegados.length)) return;
    esperando = true;
    $('enviar').disabled = true;
    var conArchivos = pegados.map(function (f) { return f.name; });
    hilo.push({ pregunta: texto.trim() + (conArchivos.length ? '\n📎 ' + conArchivos.join(', ') : ''), respuesta: null });
    // Va como formulario porque lleva archivos. Los adjuntos no entran en el hilo que se reenvía después: se
    // usan una vez, en la pregunta que los trajo.
    var datos = new FormData();
    datos.append('pregunta', texto.trim() || 'Mira lo que te adjunto y dime qué ves.');
    datos.append('antes', JSON.stringify(hilo.slice(0, -1).filter(function (t) { return t.respuesta && !t.error; }).slice(-4)));
    pegados.forEach(function (f) { datos.append('archivo', f, f.name); });
    pegados = [];
    pintarAdjuntos();
    pintar();
    fetch(location.pathname, { method: 'POST', body: datos })
      .then(function (r) { return r.json().catch(function () { return { error: 'respuesta rara del servidor' }; }); })
      .then(function (r) {
        var ultimo = hilo[hilo.length - 1];
        if (r && r.error) { ultimo.respuesta = r.error; ultimo.error = true; }
        else ultimo.respuesta = (r && r.respuesta) || '(sin respuesta)';
      })
      .catch(function () {
        var ultimo = hilo[hilo.length - 1];
        ultimo.respuesta = 'No se pudo conectar.'; ultimo.error = true;
      })
      .finally(function () { esperando = false; pintarAdjuntos(); pintar(); $('campo').focus(); });
  }

  var campo = $('campo');
  function alto() { campo.style.height = 'auto'; campo.style.height = Math.min(campo.scrollHeight, 180) + 'px'; }
  campo.addEventListener('input', function () { alto(); $('enviar').disabled = esperando || (!campo.value.trim() && !pegados.length); });
  campo.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); var t = campo.value; campo.value = ''; alto(); preguntar(t); }
  });
  $('enviar').onclick = function () { var t = campo.value; campo.value = ''; alto(); preguntar(t); };
  $('limpiar').onclick = function () { location.reload(); };
  $('clip').onclick = function () { $('archivos').click(); };
  $('archivos').onchange = function () {
    for (var i = 0; i < this.files.length && pegados.length < 4; i++) pegados.push(this.files[i]);
    this.value = '';
    pintarAdjuntos();
  };
  // Arrastrar y soltar, que es como se adjunta de verdad cuando uno tiene el archivo delante.
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files;
    for (var i = 0; f && i < f.length && pegados.length < 4; i++) pegados.push(f[i]);
    pintarAdjuntos();
  });
  document.querySelectorAll('.ideas button').forEach(function (b) {
    b.onclick = function () { preguntar(b.textContent); };
  });
})();
</script>
</body>
</html>
